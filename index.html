<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ETP Simülatör</title>
<style>
body{background:#070b14;color:#fff;font-family:sans-serif;padding:10px;margin:0}
canvas{width:100%;background:#050811;border:1px solid #1e293b;border-radius:6px;display:block}
.btn{width:100%;height:44px;font-weight:bold;border:none;border-radius:6px;background:#ef4444;color:#fff;margin:10px 0;font-size:14px;cursor:pointer}
.row{margin-bottom:8px;font-size:12px;color:#94a3b8}
input{width:100%;accent-color:#38bdf8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.box{background:#0f172a;border:1px solid #1e293b;padding:8px;border-radius:6px;font-size:11px}
.val{font-size:16px;font-weight:bold;margin-top:3px}
</style>
</head>
<body>
<h3 style="color:#38bdf8;margin:5px 0">WWTP / ETP SCADA</h3>
<canvas id="cv" width="800" height="350"></canvas>
<button id="btn" class="btn" onclick="toggle()">TESİSİ DURDUR (TRIP)</button>
<div class="row">Debi: <span id="tQ">240 m³/h</span><input type="range" id="rQ" min="50" max="450" value="240" oninput="up()"></div>
<div class="row">Koagülant: <span id="tC">60 ppm</span><input type="range" id="rC" min="0" max="150" value="60" oninput="up()"></div>
<div class="grid">
<div class="box">pH<div id="vPH" class="val" style="color:#c084fc">7.15</div></div>
<div class="box">Bakteri<div id="vB" class="val" style="color:#22c55e">%94</div></div>
<div class="box">Biyogaz<div id="vG" class="val" style="color:#f59e0b">86 Nm³/h</div></div>
<div class="box">KOİ<div id="vK" class="val" style="color:#38bdf8">%92</div></div>
</div>
<script>
var run=true,Q=240,C=60,H=94,G=86,ph=7.15;
var cv=document.getElementById("cv"),cx=cv.getContext("2d");
var bl=[],fl=[];
function toggle(){
  run=!run;
  var b=document.getElementById("btn");
  b.textContent=run?"TESİSİ DURDUR (TRIP)":"TESİSİ BAŞLAT";
  b.style.background=run?"#ef4444":"#22c55e";
  b.style.color=run?"#fff":"#000";
}
function up(){
  Q=parseFloat(document.getElementById("rQ").value);
  C=parseFloat(document.getElementById("rC").value);
  document.getElementById("tQ").textContent=Q+" m³/h";
  document.getElementById("tC").textContent=C+" ppm";
}
function draw(){
  cx.clearRect(0,0,800,350);
  if(run){
    ph=7.3-(C-50)*0.015;
    H=Math.max(10,Math.min(99,100-(Math.abs(ph-7.1)>0.3?40:0)));
    G=Math.round((Q/240)*90*(H/100));
  } else { G=Math.max(0,G*0.98); }
  document.getElementById("vPH").textContent=ph.toFixed(2);
  document.getElementById("vB").textContent="%"+H;
  document.getElementById("vG").textContent=Math.round(G)+" Nm³/h";
  
  cx.fillStyle="#334155"; cx.fillRect(0,160,800,10);
  cx.fillStyle="#eab308"; cx.fillRect(400,60,320,6); cx.fillRect(400,60,6,70); cx.fillRect(714,60,6,50);
  
  cx.fillStyle="#0f172a"; cx.fillRect(30,100,120,180); cx.strokeRect(30,100,120,180);
  cx.fillStyle="rgba(120,113,108,0.7)"; cx.fillRect(32,130,116,148);
  cx.fillStyle="#fff"; cx.fillText("1. Dengeleme",40,120);

  cx.fillStyle="#0f172a"; cx.fillRect(180,120,110,160); cx.strokeRect(180,120,110,160);
  cx.fillStyle="rgba(71,85,105,0.7)"; cx.fillRect(182,150,106,128);
  cx.fillText("2. Kimyasal",190,140);

  cx.fillStyle="#0f172a"; cx.fillRect(320,90,150,190); cx.strokeRect(320,90,150,190);
  cx.fillStyle=H>70?"rgba(13,148,136,0.8)":"rgba(180,83,9,0.8)"; cx.fillRect(322,120,146,158);
  cx.fillStyle=H>70?"#064e3b":"#451a03"; cx.fillRect(322,240,146,38);
  cx.fillStyle="#fff"; cx.fillText("3. UASB Reaktör",330,110);

  if(run&&G>5&&Math.random()<0.3) bl.push({x:340+Math.random()*110,y:240});
  cx.fillStyle="#fff";
  for(var i=bl.length-1;i>=0;i--){
    bl[i].y-=2; cx.beginPath(); cx.arc(bl[i].x,bl[i].y,2,0,Math.PI*2); cx.fill();
    if(bl[i].y<125) bl.splice(i,1);
  }

  cx.fillStyle="#0f172a"; cx.fillRect(500,140,110,140); cx.strokeRect(500,140,110,140);
  cx.fillStyle="rgba(56,189,248,0.7)"; cx.fillRect(502,160,106,118);
  cx.fillStyle="#fff"; cx.fillText("4. Deşarj",510,155);

  cx.strokeStyle="#94a3b8"; cx.beginPath(); cx.moveTo(700,280); cx.lineTo(717,110); cx.lineTo(734,280); cx.stroke();
  cx.fillText("FLARE",705,100);

  if(G>2){
    for(var k=0;k<2;k++) fl.push({x:717+(Math.random()*6-3),y:110,vy:-(1+G/30),r:3+Math.random()*4,l:1});
  }
  for(var j=fl.length-1;j>=0;j--){
    var f=fl[j]; f.y+=f.vy; f.l-=0.05;
    if(f.l<=0){ fl.splice(j,1); continue; }
    cx.fillStyle="rgba(255,"+(180*f.l)+",0,"+f.l+")";
    cx.beginPath(); cx.arc(f.x,f.y,f.r*f.l,0,Math.PI*2); cx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
